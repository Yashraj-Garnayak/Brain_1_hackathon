<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070d" />
  <title>TILE RUSH — health metrics</title>
  <meta name="description" content="Daily Ultrahuman ring metrics: sleep, recovery, HRV and heart rate." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/health.css" />
</head>
<body class="health-page">
  <main class="health">
    <header class="health-head">
      <nav class="health-nav"><a class="health-back" href="./">← TILE RUSH</a><a class="health-back" href="insights.html">INSIGHTS →</a></nav>
      <h1>Health metrics</h1>
      <p class="health-sub" id="syncInfo">Ultrahuman ring · loading…</p>
    </header>

    <form class="health-range" id="rangeForm">
      <label>From <input type="date" id="fromDate" required /></label>
      <label>To <input type="date" id="toDate" required /></label>
      <button type="submit">Load</button>
    </form>

    <p class="health-status" id="status" role="status"></p>
    <section class="health-days" id="days"></section>
  </main>

  <script src="js/health.js"></script>
</body>
</html>
